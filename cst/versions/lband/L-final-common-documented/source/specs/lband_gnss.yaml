rationale:
- Two stacked circular patches in a finite cup preserve rotational symmetry for four-feed
  CP; exterior corrugations control horizon/backside radiation.
- Air-loaded circular TM11 cavity estimate gives diameter about 0.586 wavelength,
  approximately 149 mm at L5; 140 mm is only an initial fringe/cup-loaded estimate,
  not a published internal dimension.
- Quarter-wave choke depth at L5 is approximately 63.7 mm; 60 mm is an initial candidate
  within the 87 mm envelope.
sources:
- url: https://www.beyondgravity.com/sites/default/files/media_document/2024-07/Antennas_for_GNSS_receivers_D-I-PRB-00029-SE_01-24.pdf
  evidence: Extended GNSS PEC external diameter 200 mm, height 87 mm, all GNSS bands
    and measured min/average/max envelope.
uncertainties:
- Internal dimensions are confidence C; no photo scaling is claimed.
- L5-first validation does not prove L1 or 1207 MHz performance.
- Choke ring widths and depths, air loading, and feed implementation require EM validation.
