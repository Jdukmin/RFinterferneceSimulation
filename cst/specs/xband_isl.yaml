model_identity: XBAND_ISL_RFC_SURROGATE
purpose: RFC/RFI screening free-space radiation model; NOT a product reconstruction.
repository_evidence:
  numeric_target: NONE  # repository_ssot.json xband_isl.status = NO_REPOSITORY_NUMERIC_TARGET_FOUND
  coverage_note: 'Owner: 10.4 GHz, 3 dB beamwidth about 60 deg, overall beamwidth about 120 deg'
user_requirements:   # owner statement 2026-10-03
  center_frequency_ghz: 10.6
  hpbw_3db_deg: 60
  coverage_beamwidth_deg: 120   # overall beam/coverage width, not the 3 dB width
superseded:
  - 'isl-v01..v04 were solved at ASSUMED 8.0-8.4 GHz with an ASSUMED 120 deg HPBW template; kept as history only.'
assumptions:
  - id: ISL-A1
    item: frequency band
    value: {fmin_ghz: 10.55, f0_ghz: 10.6, fmax_ghz: 10.65}
    tag: OWNER_EXPLICIT
    reason: Owner updated operating band on 2026-10-04; retain accepted geometry unchanged. Original 10.3/10.4/10.5 results remain historical.
  - id: ISL-A2
    item: polarization
    value: RHCP (IEEE), CST e^(+jwt) cp_plus
    tag: ASSUMPTION
  - id: ISL-A3
    item: reference pattern
    value: 'G(theta) = G0 + 10*q*log10(cos(theta)), q = 4.819 (-3 dB at 30 deg -> 60 deg HPBW; -14.5 dB at 60 deg -> 120 deg coverage width)'
    tag: ASSUMPTION
    reason: Shape from the owner HPBW; every point ASSUMED, none is a hard anchor.
  - id: ISL-A3b
    item: reference peak gain
    value: 'G0 = 10*log10(32400/HPBW^2) = 9.54 dBi'
    tag: ASSUMPTION
    reason: No absolute gain given; standard practical-aperture estimate for a symmetric 60 deg beam.
  - id: ISL-A4
    item: unvalidated region conservative envelope
    value: 'max(template for theta<90, -10 dBi floor)'
    tag: ASSUMED_CONSERVATIVE
  - id: ISL-A5
    item: feed
    value: four ideal 50-ohm discrete ports, equal amplitude, phases 0/-90/-180/-270 deg
    tag: SURROGATE
reference:
  q: 4.81884167930642
  peak_dbi: 9.542425094393248
acceptance:
  gain_basis: ACCEPTED_POWER_GAIN   # active return loss diagnostic only
  coverage_deg: 60
  main_mae_db: 1.5                  # vs assumed template, 0..60 deg, both cuts, low/center/high
  hpbw_target_deg: 60
  hpbw_relative_error: 0.10
  hard_anchors: []                  # no source data exist
  axial_ratio_diagnostic_db: 3
  mesh_validation: DISABLED_BY_USER
  max_candidates: 4                 # for the 10.4 GHz requirement set
candidates:
  ISL_A_QHELIX_SCALED:
    topology: 4-arm resonant multifilar helix, accepted S-band surrogate scaled by 2.25/8.2, mirrored for RHCP
    scale: 0.274390244
    source_geometry: SBAND_MATCHING_WIRE15 (frozen) - helix D18 H52 0.5 turn wire r1.5 gap1.2, base D65 depth32 groove depth20
  ISL_B_CUPPATCH:
    topology: short PEC cup + air-loaded circular patch + 4-probe quadrature feed
    dimensions_mm:   # all confidence C (EM initial estimate)
      ground_radius: 15.0
      floor_thickness: 1.0
      rim_height: 4.0
      rim_thickness: 1.0
      patch_diameter: 16.6     # air TM11 with Hammerstad fringing at h=2.5 mm, 8.2 GHz
      patch_height: 2.5
      patch_thickness: 0.5
      feed_radius: 3.0
      probe_radius: 0.4
      feed_gap: 0.5
  ISL_C_CUPPATCH_10G4:
    topology: isl-v02 cup patch scaled by 8.2/10.4 (HPBW about 67 deg at 8.2 GHz)
    dimensions_mm:
      ground_radius: 11.827
      floor_thickness: 0.789
      rim_height: 3.154
      rim_thickness: 0.789
      patch_diameter: 13.089
      patch_height: 1.971
      patch_thickness: 0.394
      feed_radius: 2.365
      probe_radius: 0.315
      feed_gap: 0.394
